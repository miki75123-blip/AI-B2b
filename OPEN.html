<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI LeadGen Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-box h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child { border: none; }
        .label { color: #666; font-size: 14px; }
        .value { color: #333; font-weight: 600; font-size: 14px; }
        .value code {
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffc107;
        }
        .status-dot.offline { background: #dc3545; }
        .status-text { color: #856404; font-size: 14px; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        
        .steps {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .steps h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .step {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #666;
        }
        .step-num {
            background: #667eea;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI LeadGen Agent</h1>
        <p class="subtitle">B2B 潛在客戶開發系統</p>
        
        <div class="status" id="statusBox">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">檢測本地服務...</span>
        </div>
        
        <div class="info-box">
            <h3>📋 登入資訊</h3>
            <div class="info-item">
                <span class="label">Email</span>
                <span class="value"><code>admin@example.com</code></span>
            </div>
            <div class="info-item">
                <span class="label">Password</span>
                <span class="value"><code>admin123</code></span>
            </div>
        </div>
        
        <a href="http://localhost:5173" class="btn" id="openBtn">
            🚀 打開 AI LeadGen 系統
        </a>
        
        <div class="steps">
            <h3>📖 啟動步驟（如果打不開）</h3>
            <div class="step">
                <span class="step-num">1</span>
                <span>開啟終端，進入專案目錄</span>
            </div>
            <div class="step">
                <span class="step-num">2</span>
                <span>後端：<code>cd backend && python -m uvicorn app.main:app --reload</code></span>
            </div>
            <div class="step">
                <span class="step-num">3</span>
                <span>前端：<code>cd frontend && npm run dev</code></span>
            </div>
            <div class="step">
                <span class="step-num">4</span>
                <span>回到這裡點擊上方按鈕</span>
            </div>
        </div>
    </div>
    
    <script>
        async function checkService() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const openBtn = document.getElementById('openBtn');
            
            try {
                const response = await fetch('http://localhost:8000/health');
                if (response.ok) {
                    statusDot.classList.remove('offline');
                    statusText.textContent = '✅ 服務已就緒！';
                    openBtn.href = 'http://localhost:5173';
                }
            } catch (e) {
                statusDot.classList.add('offline');
                statusText.textContent = '⚠️ 本地服務未運行，請先啟動';
                openBtn.href = '#';
                openBtn.onclick = (e) => {
                    e.preventDefault();
                    alert('請先在終端運行：\n\n1. cd backend\n   python -m uvicorn app.main:app --reload\n\n2. 新開終端\n   cd frontend\n   npm run dev');
                };
            }
        }
        
        checkService();
    </script>
</body>
</html>
